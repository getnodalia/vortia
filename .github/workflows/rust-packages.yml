name: Rust packages

# Builds the Linux AppImage and tarball of the Rust app (R9 of docs/architecture/rust-only.md) on
# an old distro so they run on newer ones, and its macOS DMG (the installer window of the existing
# app), checks what is inside and keeps them as workflow artifacts. It does not attach anything to a
# release: release-rust.yml builds and attaches the release packages.

on:
  pull_request:
    paths: ["rust/packaging/**", "packaging/macos/create_dmg.sh", ".github/workflows/rust-packages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: AppImage and tarball (ubuntu-22.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check the desktop file
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
      - name: Package
        run: rust/packaging/linux/package.sh --out "$RUNNER_TEMP/dist"
      - name: The tarball holds a working command-line tool
        run: |
          mkdir "$RUNNER_TEMP/check"
          tar -xzf "$RUNNER_TEMP"/dist/Vortia-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/check"
          "$RUNNER_TEMP"/check/Vortia-*-linux-x86_64/bin/vortia help
      - name: The AppImage is there and is not empty
        run: test -s "$(ls "$RUNNER_TEMP"/dist/Vortia-*-linux-x86_64.AppImage)"
      - uses: actions/upload-artifact@v4
        with:
          name: vortia-rust-linux
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  macos:
    name: DMG (macos-15)
    # macOS slots are kept for releases (release-rust.yml builds the DMG): by hand only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Package
        run: rust/packaging/macos/package.sh --out "$RUNNER_TEMP/dist"
      - name: The DMG opens with the app, the Applications link and the background
        run: |
          dmg="$(ls "$RUNNER_TEMP"/dist/Vortia-*-macos-*.dmg)"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mnt" >/dev/null
          trap 'hdiutil detach "$RUNNER_TEMP/mnt" >/dev/null' EXIT
          test -x "$RUNNER_TEMP/mnt/Vortia.app/Contents/MacOS/vortia-app"
          test -x "$RUNNER_TEMP/mnt/Vortia.app/Contents/MacOS/vortia"
          test -L "$RUNNER_TEMP/mnt/Applications"
          test -f "$RUNNER_TEMP/mnt/.background/background.tiff"
          test -f "$RUNNER_TEMP/mnt/Vortia.app/Contents/Resources/Vortia.icns"
          codesign --verify --strict "$RUNNER_TEMP/mnt/Vortia.app"
      - uses: actions/upload-artifact@v4
        with:
          name: vortia-rust-macos
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
