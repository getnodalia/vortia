name: Release packages (Rust)

# Builds the Linux AppImage and tarball and the macOS DMG of the Rust app, checks what is
# inside, and only then attaches them, with their SHA-256 sums, to a GitHub Release.
#
# "Release from main" (release-auto.yml) runs this with tag=vX.Y.Z when a new version of
# rust/Cargo.toml and its notes (docs/release-notes/) land on main, and publishes the release once
# the files are attached. By hand: run it with the tag of a draft release. There is deliberately
# no "release: published" trigger: it would rebuild and replace the files that were just verified.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release tag to attach the packages to, e.g. v0.11.0"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the packages to"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-rust-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: A tag must describe the code it is built from
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          manifest="$(awk '/^\[/ { in_pkg = ($0 == "[workspace.package]"); next } in_pkg && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' rust/Cargo.toml)"
          test -n "$manifest"
          if [[ "${TAG#v}" != "$manifest" ]]; then
            echo "Tag $TAG does not match the version $manifest of rust/Cargo.toml" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

  linux:
    name: AppImage and tarball (ubuntu-22.04)
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check the desktop file
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
      - name: Package
        run: rust/packaging/linux/package.sh --out "$RUNNER_TEMP/dist"
      - name: The tarball holds a working command-line tool
        run: |
          mkdir "$RUNNER_TEMP/check"
          tar -xzf "$RUNNER_TEMP"/dist/Vortia-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/check"
          "$RUNNER_TEMP"/check/Vortia-*-linux-x86_64/bin/vortia help
      - name: The AppImage is there and is not empty
        run: test -s "$RUNNER_TEMP/dist/Vortia-${{ needs.version.outputs.version }}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: vortia-rust-linux
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  macos:
    name: DMG (macos-15)
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Package
        run: rust/packaging/macos/package.sh --out "$RUNNER_TEMP/dist"
      - name: The DMG opens with the app, the Applications link and the background
        run: |
          dmg="$(ls "$RUNNER_TEMP"/dist/Vortia-*-macos-*.dmg)"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mnt" >/dev/null
          trap 'hdiutil detach "$RUNNER_TEMP/mnt" >/dev/null' EXIT
          test -x "$RUNNER_TEMP/mnt/Vortia.app/Contents/MacOS/vortia-app"
          test -x "$RUNNER_TEMP/mnt/Vortia.app/Contents/MacOS/vortia"
          test -L "$RUNNER_TEMP/mnt/Applications"
          test -f "$RUNNER_TEMP/mnt/.background/background.tiff"
          test -f "$RUNNER_TEMP/mnt/Vortia.app/Contents/Resources/Vortia.icns"
          codesign --verify --strict "$RUNNER_TEMP/mnt/Vortia.app"
      - uses: actions/upload-artifact@v4
        with:
          name: vortia-rust-macos
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  attach-to-release:
    # Nothing reaches a release unless every check above passed.
    needs: [version, linux, macos]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach packages and their SHA-256 sums to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          cd dist
          for f in Vortia-*.AppImage Vortia-*.tar.gz Vortia-*.dmg; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -lh
          gh release upload "$TAG" Vortia-* --repo "${{ github.repository }}" --clobber
